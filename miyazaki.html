                        images: [

                        ]
                    },
                    { time: "17:00 - 19:30", type: "spot", title: "宮崎市區悠閒採買", desc: "前往 AEON MALL 購買芒果相關伴手禮。" },
                    { time: "20:00", type: "food", title: "【晚餐】辛麺屋 桝元 宮崎本店", desc: "著名的『宮崎拉麵』！使用的富有彈性的蒟蒻麵，辣度可自選。" },
                ],
                hotel: { name: "PRINCE SMART INN", location: "宮崎市區", link: "https://www.trip.com/t/zt7FIIsnLU2" }

            {
                day: 5,
                title: "滿載而歸",
                events: [
                    { time: "07:00", type: "car", title: "前往機場", desc: "自駕建議在機場附近將油加滿。" },
                    { time: "09:00", type: "car", title: "搭機返家", desc: "告別神話之鄉，期待下一次探索。" }
                ],
                hotel: null
            }
        ];

        // --- Gemini API Logic ---
        async function fetchGeminiWithRetry(prompt, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            // 💡 使用填入的 apiKey
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    let text = result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，無法回應。";
                    return text.replace(/```html\n?/g, '').replace(/```\n?/g, '');
                } catch (error) { if (i === retries - 1) throw error; await new Promise(resolve => setTimeout(resolve, delays[i])); }
            }
        }

        async function openPackingModal() {
            const modal = document.getElementById('packing-modal');
            const content = document.getElementById('packing-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex flex-col items-center justify-center py-12 text-emerald-600 gap-3 text-center"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto"></i><p class="text-sm font-bold">正在根據行程深度整理清單...</p></div>`;
            lucide.createIcons();
            const tripSummary = itineraryData.map(d => `Day ${d.day}: ${d.title}`).join('、');
            const prompt = `你是專業旅遊管家。行程包含：${tripSummary}。請整理一份專屬行李清單。包含：自駕必備文件、山區與海邊衣物建議。HTML 格式輸出。繁體中文。`;
            try { 
                const responseHtml = await fetchGeminiWithRetry(prompt); 
                content.innerHTML = responseHtml; 
            } catch (err) { 
                content.innerHTML = `<p class="text-red-500 text-center py-10">產出失敗，請確保您的 API Key 有效且已開啟 Gemini API 權限。</p>`; 
            }
        }

        function closePackingModal() { document.getElementById('packing-modal').classList.add('hidden'); }

        // --- Rendering Logic ---
        const getEventStyles = (type) => {
            switch (type) {
                case 'food': return { icon: 'utensils', color: 'bg-orange-50 text-orange-600', dot: 'bg-orange-500' };
                case 'spot': return { icon: 'camera', color: 'bg-emerald-50 text-emerald-600', dot: 'bg-emerald-500' };
                case 'car': return { icon: 'car', color: 'bg-blue-50 text-blue-600', dot: 'bg-blue-500' };
                default: return { icon: 'map-pin', color: 'bg-gray-50 text-gray-600', dot: 'bg-gray-500' };
            }
        };

        let activeDay = 1;

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            itineraryData.forEach(day => {
                const btn = document.createElement('button');
                const isActive = activeDay === day.day;
                btn.className = `flex-shrink-0 px-4 py-2 rounded-lg font-bold text-xs transition-all duration-300 flex items-center gap-1.5 ${isActive ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-100'}`;
                btn.onclick = () => { activeDay = day.day; renderTabs(); renderContent(); window.scrollTo({top: 0, behavior: 'smooth'}); };
                btn.innerHTML = `<i data-lucide="calendar" class="w-3.5 h-3.5 ${isActive ? '' : 'opacity-50'}"></i> Day ${day.day}`;
                tabsContainer.appendChild(btn);
            });
            lucide.createIcons();
        }

        function renderContent() {
            const contentContainer = document.getElementById('day-content');
            const dayData = itineraryData.find(d => d.day === activeDay);
            let eventsHtml = dayData.events.map(event => {
                const styles = getEventStyles(event.type);
                let imgSection = '';
                if (event.images && event.images.length > 0) {
                    imgSection = event.images.map(img => `
                        <div class="mt-4 overflow-hidden rounded-xl border border-slate-100 shadow-sm bg-white">
                            <img src="${img.url}" alt="${img.title}" class="w-full h-40 md:h-72 object-cover hover:scale-105 transition-transform duration-700">
                            ${img.credit ? `<p class="px-3 py-1.5 text-[9px] md:text-[10px] text-slate-400 text-right italic border-t border-slate-50">${img.credit}</p>` : ''}
                        </div>
                    `).join('');
                }
                return `
                    <div class="relative flex flex-col md:flex-row gap-5 md:gap-8 items-start mb-10 text-left">
                        <div class="md:w-[80px] flex-shrink-0 pt-1 md:text-right flex md:block items-center gap-2">
                            <div class="md:hidden absolute -left-[27px] w-3.5 h-3.5 rounded-full border-2 border-white ${styles.dot} z-10 shadow-sm"></div>
                            <div class="text-slate-400 font-bold text-[10px] md:text-xs tracking-wider">${event.time}</div>
                        </div>
                        <div class="hidden md:block absolute left-[89px] top-1.5 w-3.5 h-3.5 rounded-full border-2 border-white ${styles.dot} z-10 shadow-sm"></div>
                        <div class="flex-1 bg-white border border-slate-50 rounded-xl p-4 md:p-6 shadow-sm hover:shadow-md transition-all w-full">
                            <div class="flex items-start gap-4">
                                <div class="p-2.5 rounded-lg flex-shrink-0 ${styles.color}"><i data-lucide="${styles.icon}" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                                <div class="w-full">
                                    <h3 class="text-base md:text-lg font-bold text-slate-800 mb-2 leading-snug">${event.title}</h3>
                                    <div class="text-slate-500 text-xs md:text-sm leading-relaxed">${event.desc}</div>
                                    ${imgSection}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let hotelHtml = '';
            if (dayData.hotel) {
                let linkHtml = dayData.hotel.link ? `<a href="${dayData.hotel.link}" target="_blank" rel="noopener noreferrer" class="w-full md:w-auto text-center px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-purple-100">查看住宿資訊</a>` : '';
                hotelHtml = `<div class="mt-16 pt-8 border-t border-slate-100"><div class="bg-gradient-to-r from-purple-50 to-white rounded-2xl p-5 md:p-6 border border-purple-100 flex flex-col md:flex-row items-center justify-between gap-4"><div class="flex items-center gap-4"><div class="bg-purple-100 text-purple-600 p-3 rounded-xl"><i data-lucide="bed" class="w-6 h-6"></i></div><div><div class="text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-0.5">Tonight's Accommodation</div><div class="text-base md:text-lg font-bold text-slate-800">${dayData.hotel.name}</div><div class="text-slate-500 text-xs mt-1">📍 ${dayData.hotel.location}</div></div></div>${linkHtml}</div></div>`;
            }

            contentContainer.innerHTML = `
                <div class="mb-10 text-center md:text-left border-b border-slate-50 pb-6">
                    <h2 class="text-xl md:text-2xl font-black text-slate-800 tracking-tight"><span class="text-emerald-600 mr-2 text-lg font-mono">DAY ${dayData.day}</span> ${dayData.title}</h2>
                </div>
                <div class="relative pl-4 md:pl-0">
                    <div class="absolute left-[23px] md:left-[95px] top-4 bottom-4 w-0.5 bg-slate-100"></div>
                    <div class="space-y-4">${eventsHtml}</div>
                </div>
                ${hotelHtml}
            `;
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => { renderTabs(); renderContent(); });
    </script>
