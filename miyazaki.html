        // --- Gemini API 封裝 ---
        async function fetchGeminiWithRetry(prompt, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    let text = result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，AI 暫時無法回應。";
                    // 移除潛在的 markdown 標籤以確保 HTML 乾淨
                    return text.replace(/```html\n?/g, '').replace(/```\n?/g, '');
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

            const prompt = `你是專業的旅遊管家。使用者即將前往日本九州進行五天四夜的自駕遊。行程路線包含：${tripSummary}。
            
請根據這個自駕、山區(高千穗、阿蘇火山)、海線(宮崎海岸)的綜合特性，幫他整理一份貼心實用的「專屬行李準備清單」（需包含自駕必備文件、山區建議衣物等）。
請直接輸出 HTML 格式，使用 <h3> 標題分類，並用 <ul> <li> 列出項目。文字可以使用 <strong> 標示重點。請用繁體中文回答，語氣專業且溫暖。`;

            try {
                const responseHtml = await fetchGeminiWithRetry(prompt);
                content.innerHTML = responseHtml;
            } catch (err) {
                content.innerHTML = `<div class="text-red-500 py-10 text-center"><i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2"></i> 產出失敗，請稍後再試。</div>`;
                lucide.createIcons();
            }
        }

        function closePackingModal() {
            document.getElementById('packing-modal').classList.add('hidden');
        }

        // --- 每日 AI 小秘訣邏輯 ---
        async function generateAITips(dayIndex) {
            const container = document.getElementById(`ai-tips-container-${dayIndex}`);
            const button = document.getElementById(`ai-tips-button-${dayIndex}`);
            
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="flex items-center justify-center gap-3 text-emerald-600 py-4">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> 
                    <span class="font-medium">✨ AI 導遊正在為您整理今日的隱藏版小秘訣...</span>
                </div>
            `;
            button.disabled = true;
            button.classList.add('opacity-50', 'cursor-not-allowed');
            lucide.createIcons();

            const dayData = itineraryData.find(d => d.day === dayIndex);
            const itineraryText = dayData.events.map(e => `${e.time}: ${e.title} - ${e.desc}`).join('\n');

            const prompt = `你是專業的日本九州在地導遊。遊客今天（第 ${dayData.day} 天：${dayData.title}）的行程如下：\n${itineraryText}\n
請針對今天的這幾個特定景點或餐廳，給予 3 點簡短、實用的「在地人小秘訣」（例如：停車動線建議、沿途推薦順手買的在地小吃、或是哪個景點的隱藏拍照角度）。
請用繁體中文回答，語氣要熱情專業。請直接輸出 HTML 格式（不需要外層容器，直接給 <ul><li>...</li></ul> 等標籤，文字可以使用 <strong> 標示重點）。`;

            try {
                const responseHtml = await fetchGeminiWithRetry(prompt);
                container.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-emerald-100 p-2.5 rounded-full flex-shrink-0 mt-1">
                            <i data-lucide="sparkles" class="w-6 h-6 text-emerald-600"></i>
                        </div>
                        <div class="text-slate-700 w-full ai-response">
                            <h4 class="font-bold text-lg text-emerald-800 mb-2">✨ AI 導遊的在地小秘訣</h4>
                            ${responseHtml}
                        </div>
                    </div>
                `;
                lucide.createIcons();
            } catch (error) {
                container.innerHTML = `<div class="text-red-500 flex items-center gap-2"><i data-lucide="alert-circle" class="w-5 h-5"></i> 無法取得建議，請稍後再試。</div>`;
                lucide.createIcons();
            } finally {
                button.disabled = false;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
                button.innerHTML = `✨ 重新詢問 AI 導遊 ✨`;
            }
        }


        // --- UI 渲染邏輯 ---
        const getEventStyles = (type) => {
            switch (type) {
                case 'food': return { icon: 'utensils', color: 'bg-orange-100 text-orange-600', dot: 'bg-orange-500' };
                case 'spot': return { icon: 'camera', color: 'bg-emerald-100 text-emerald-600', dot: 'bg-emerald-500' };
                case 'car': return { icon: 'car', color: 'bg-blue-100 text-blue-600', dot: 'bg-blue-500' };
                default: return { icon: 'map-pin', color: 'bg-gray-100 text-gray-600', dot: 'bg-gray-500' };
            }
        };

        let activeDay = 1;

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            itineraryData.forEach(day => {
                const btn = document.createElement('button');
                const isActive = activeDay === day.day;
                
                btn.className = `flex-shrink-0 px-6 py-3 rounded-xl font-bold text-base transition-all duration-300 flex items-center gap-2 ${
                    isActive ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-200' : 'bg-white text-slate-500 hover:bg-slate-100 border border-slate-200'
                }`;
                
                btn.onclick = () => {
                    activeDay = day.day;
                    renderTabs(); 
                    renderContent();
                };
                
                btn.innerHTML = `<i data-lucide="calendar" class="w-[18px] h-[18px] ${isActive ? 'opacity-100' : 'opacity-50'}"></i> Day ${day.day}`;
                tabsContainer.appendChild(btn);
            });
        }

        function renderContent() {
            const contentContainer = document.getElementById('day-content');
            const dayData = itineraryData.find(d => d.day === activeDay);
            
            let eventsHtml = dayData.events.map(event => {
                const styles = getEventStyles(event.type);
                return `
                    <div class="relative flex flex-col md:flex-row gap-6 md:gap-10 items-start group">
                        <div class="md:w-[100px] flex-shrink-0 pt-1 md:text-right flex md:block items-center gap-3">
                            <div class="md:hidden absolute -left-[29px] w-4 h-4 rounded-full border-4 border-white ${styles.dot} shadow-sm z-10"></div>
                            <div class="text-slate-500 font-bold bg-slate-100 md:bg-transparent px-3 py-1 md:p-0 rounded-md text-sm md:text-base">${event.time}</div>
                        </div>
                        <div class="hidden md:block absolute left-[111px] top-2 w-4 h-4 rounded-full border-4 border-white ${styles.dot} shadow-sm z-10 transition-transform group-hover:scale-125"></div>
                        <div class="flex-1 bg-white border border-slate-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex items-start gap-4">
                                <div class="p-3 rounded-xl flex-shrink-0 ${styles.color}"><i data-lucide="${styles.icon}" class="w-5 h-5"></i></div>
                                <div>
                                    <h3 class="text-lg font-bold text-slate-800 mb-2 leading-snug">${event.title}</h3>
                                    <p class="text-slate-600 leading-relaxed text-sm md:text-base">${event.desc}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // ✨ AI 導遊互動區塊
            const aiSectionHtml = `
                <div class="mt-12 pt-8 border-t border-slate-100">
                    <button id="ai-tips-button-${dayData.day}" onclick="generateAITips(${dayData.day})" 
                            class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200 hover:shadow-xl hover:scale-[1.01] transition-all flex items-center justify-center gap-2 text-lg">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> ✨ 詢問 AI 導遊：今日在地小秘訣 ✨
                    </button>
                    <div id="ai-tips-container-${dayData.day}" class="hidden mt-6 p-6 bg-emerald-50/80 border border-emerald-100 rounded-2xl transition-all"></div>
                </div>
            `;

            let hotelHtml = '';
            if (dayData.hotel) {
                let linkHtml = dayData.hotel.link ? `
                    <a href="${dayData.hotel.link}" target="_blank" rel="noopener noreferrer" class="w-full md:w-auto text-center px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-xl transition-colors flex items-center justify-center gap-2">
                        查看住宿資訊 <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>` : '';
                hotelHtml = `
                    <div class="mt-12 pt-8 border-t border-slate-100">
                        <div class="bg-purple-50 rounded-2xl p-6 border border-purple-100">
                            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                                <div class="flex items-center gap-4 w-full md:w-auto">
                                    <div class="bg-purple-100 text-purple-600 p-3 rounded-xl flex-shrink-0"><i data-lucide="bed" class="w-6 h-6"></i></div>
                                    <div>
                                        <div class="text-sm font-bold text-purple-600 mb-1 flex items-center gap-1"><i data-lucide="moon" class="w-3.5 h-3.5"></i> 今晚住宿</div>
                                        <div class="text-lg font-bold text-slate-800">${dayData.hotel.name}</div>
                                        <div class="text-sm text-slate-500 mt-1 flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${dayData.hotel.location}</div>
                                    </div>
                                </div>
                                ${linkHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            contentContainer.innerHTML = `
                <div class="mb-10 text-center md:text-left">
                    <h2 class="text-2xl md:text-3xl font-bold text-slate-800">
                        <span class="text-emerald-600 mr-3">Day ${dayData.day}</span> ${dayData.title}
                    </h2>
                </div>
                <div class="relative pl-4 md:pl-0">
                    <div class="absolute left-[23px] md:left-[119px] top-4 bottom-4 w-0.5 bg-slate-100"></div>
                    <div class="space-y-10">
                        ${eventsHtml}
                    </div>
                </div>
                ${aiSectionHtml}
                ${hotelHtml}
            `;
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderContent();
            lucide.createIcons();
        });
    </script>
</body>
</html>
